<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GB Camera Filter</title>
<style>
  :root {
    --bg: #161812;
    --panel: #22261b;
    --line: #3a4130;
    --text: #e4ead2;
    --muted: #9aa486;
    --accent: #9bbc0f;
    --accent-dark: #306230;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  header {
    padding: 16px 20px 8px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font: 700 20px/1 ui-monospace, Consolas, monospace;
    letter-spacing: .12em;
    color: var(--accent);
  }
  header p { margin: 0; color: var(--muted); }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 16px;
    padding: 8px 20px 24px;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 8px 16px 24px; }
  }
  #drop {
    position: relative;
    min-height: 420px;
    border: 2px dashed var(--line);
    border-radius: 10px;
    display: grid;
    place-items: center;
    padding: 16px;
    overflow: auto;
    transition: border-color .15s, background .15s;
  }
  #drop.over { border-color: var(--accent); background: rgba(155, 188, 15, .06); }
  #out {
    display: block;
    max-width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
  }
  button, .btn, select {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent-dark); border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  .btn input { display: none; }
  aside {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    align-self: start;
  }
  aside h2 {
    margin: 14px 0 8px;
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  aside h2:first-child { margin-top: 0; }
  .ctl { margin-bottom: 10px; }
  .ctl label { display: flex; justify-content: space-between; font-size: 13px; }
  .ctl output { color: var(--accent); font-family: ui-monospace, Consolas, monospace; }
  .ctl input[type=range] { width: 100%; accent-color: var(--accent); }
  .ctl select { width: 100%; }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .check input { accent-color: var(--accent); }
  .swatches { display: flex; gap: 4px; margin-top: 6px; }
  .swatches span { flex: 1; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.4); }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  video { display: none; }
</style>
</head>
<body>
<header>
  <h1>GB CAMERA FILTER</h1>
  <p>画像をドロップ / 貼り付け(Ctrl+V) / 選択 で 128×112・4階調に変換</p>
</header>

<main>
  <section>
    <div id="drop">
      <canvas id="out"></canvas>
    </div>
    <div class="bar">
      <label class="btn">画像を選択<input type="file" id="file" accept="image/*"></label>
      <button id="camBtn">Webカメラ</button>
      <button id="shutterBtn" disabled>撮影(静止)</button>
      <button id="saveBtn" class="primary">PNG保存</button>
      <select id="exportScale" title="保存時の倍率">
        <option value="1">保存 1x</option>
        <option value="2">保存 2x</option>
        <option value="4" selected>保存 4x</option>
        <option value="8">保存 8x</option>
      </select>
    </div>
  </section>

  <aside>
    <h2>表示</h2>
    <div class="ctl">
      <label for="palette">パレット</label>
      <select id="palette"></select>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="ctl">
      <label for="viewScale">表示倍率 <output id="viewScaleV"></output></label>
      <input type="range" id="viewScale" min="1" max="8" step="1">
    </div>
    <label class="check"><input type="checkbox" id="frame"> 160×144 フレームを付ける</label>
    <label class="check"><input type="checkbox" id="mirror"> 左右反転</label>

    <h2>センサー</h2>
    <div class="ctl">
      <label for="down">縮小方法</label>
      <select id="down">
        <option value="smooth">平均(なめらか)</option>
        <option value="nearest">ニアレストネイバー</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="autoLevels"> 自動レベル補正</label>
    <div class="ctl">
      <label for="brightness">明るさ <output id="brightnessV"></output></label>
      <input type="range" id="brightness" min="-0.5" max="0.5" step="0.01">
    </div>
    <div class="ctl">
      <label for="contrast">コントラスト <output id="contrastV"></output></label>
      <input type="range" id="contrast" min="0.5" max="3" step="0.05">
    </div>
    <div class="ctl">
      <label for="gamma">ガンマ <output id="gammaV"></output></label>
      <input type="range" id="gamma" min="0.4" max="2.5" step="0.05">
    </div>
    <div class="ctl">
      <label for="sharpen">輪郭強調 <output id="sharpenV"></output></label>
      <input type="range" id="sharpen" min="0" max="4" step="0.1">
    </div>

    <h2>レンズ</h2>
    <div class="ctl">
      <label for="blur">ぼかし <output id="blurV"></output></label>
      <input type="range" id="blur" min="0" max="1" step="0.05">
    </div>
    <div class="ctl">
      <label for="vignette">周辺減光 <output id="vignetteV"></output></label>
      <input type="range" id="vignette" min="0" max="1" step="0.05">
    </div>

    <h2>階調</h2>
    <label class="check"><input type="checkbox" id="dither"> 4×4 Bayer ディザ</label>

    <div class="bar"><button id="resetBtn">初期値に戻す</button></div>
    <p class="note">処理順: 8:7クロップ → 128×112縮小 → グレースケール → 輪郭強調 → コントラスト → 4階調ディザ</p>
  </aside>
</main>

<video id="video" playsinline muted></video>
<input type="file" id="hiddenFile" hidden>

<script>
(() => {
  const W = 128, H = 112, FW = 160, FH = 144;
  // 4x4 Bayer threshold matrix
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  // Colors are ordered darkest -> lightest
  const PALETTES = {
    dmg:    { name: '初代GB (DMG 緑)',      c: ['#0f380f', '#306230', '#8bac0f', '#9bbc0f'] },
    gray:   { name: 'プリンター / グレー',   c: ['#000000', '#555555', '#aaaaaa', '#ffffff'] },
    pocket: { name: 'GBポケット液晶',        c: ['#1f1f1f', '#4d533c', '#8b956d', '#c4cfa1'] },
    sepia:  { name: 'セピア',               c: ['#2b1b0e', '#6b4a2b', '#b48a5a', '#f0dcb4'] },
  };
  const DEFAULTS = {
    palette: 'dmg', viewScale: 4, frame: true, mirror: false,
    down: 'smooth', autoLevels: true,
    brightness: 0, contrast: 1.4, gamma: 1, sharpen: 1.2,
    blur: 0, vignette: 0.25, dither: true,
  };
  const STORE_KEY = 'gbcamera-settings';

  const $ = id => document.getElementById(id);
  const out = $('out');
  const octx = out.getContext('2d');
  const work = document.createElement('canvas');
  work.width = W; work.height = H;
  const wctx = work.getContext('2d', { willReadFrequently: true });
  const video = $('video');

  let opts = { ...DEFAULTS };
  try { Object.assign(opts, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) {}

  let source = makeSample();
  let stream = null;
  let pending = false;

  // ---------- UI wiring ----------
  const sel = $('palette');
  for (const [k, p] of Object.entries(PALETTES)) sel.add(new Option(p.name, k));

  const ranges = ['viewScale', 'brightness', 'contrast', 'gamma', 'sharpen', 'blur', 'vignette'];
  const checks = ['frame', 'mirror', 'autoLevels', 'dither'];
  const selects = ['palette', 'down'];

  function syncUI() {
    for (const k of ranges) { $(k).value = opts[k]; $(k + 'V').textContent = fmt(k, opts[k]); }
    for (const k of checks) $(k).checked = opts[k];
    for (const k of selects) $(k).value = opts[k];
    $('swatches').innerHTML = PALETTES[opts.palette].c.map(c => `<span style="background:${c}"></span>`).join('');
  }
  function fmt(k, v) {
    v = Number(v);
    if (k === 'viewScale') return v + 'x';
    if (k === 'brightness') return (v > 0 ? '+' : '') + v.toFixed(2);
    return v.toFixed(2);
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(opts)); } catch (e) {}
  }
  for (const k of ranges) $(k).addEventListener('input', e => { opts[k] = Number(e.target.value); changed(); });
  for (const k of checks) $(k).addEventListener('change', e => { opts[k] = e.target.checked; changed(); });
  for (const k of selects) $(k).addEventListener('change', e => { opts[k] = e.target.value; changed(); });
  $('resetBtn').addEventListener('click', () => { opts = { ...DEFAULTS }; changed(); });

  function changed() { syncUI(); save(); schedule(); }
  function schedule() {
    if (pending || stream) return; // live camera renders every frame anyway
    pending = true;
    requestAnimationFrame(() => { pending = false; render(); });
  }

  // ---------- Input: file / drop / paste ----------
  $('file').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; });
  const drop = $('drop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('over');
    const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if (f) loadFile(f);
  });
  window.addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) loadFile(item.getAsFile());
  });

  function loadFile(file) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { stopCamera(); source = img; schedule(); URL.revokeObjectURL(url); };
    img.onerror = () => { URL.revokeObjectURL(url); alert('画像を読み込めませんでした'); };
    img.src = url;
  }

  // ---------- Webcam ----------
  $('camBtn').addEventListener('click', async () => {
    if (stream) { stopCamera(); schedule(); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
    } catch (e) {
      stream = null;
      alert('カメラを起動できませんでした: ' + e.message);
      return;
    }
    video.srcObject = stream;
    await video.play();
    source = video;
    $('camBtn').textContent = 'カメラ停止';
    $('shutterBtn').disabled = false;
    if (!opts.mirror) { opts.mirror = true; syncUI(); }
    requestAnimationFrame(liveLoop);
  });
  function liveLoop() {
    if (!stream) return;
    render();
    requestAnimationFrame(liveLoop);
  }
  $('shutterBtn').addEventListener('click', () => {
    if (!stream) return;
    const snap = document.createElement('canvas');
    snap.width = video.videoWidth; snap.height = video.videoHeight;
    snap.getContext('2d').drawImage(video, 0, 0);
    stopCamera();
    source = snap;
    schedule();
  });
  function stopCamera() {
    if (!stream) return;
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
    $('camBtn').textContent = 'Webカメラ';
    $('shutterBtn').disabled = true;
  }

  // ---------- Save ----------
  $('saveBtn').addEventListener('click', () => {
    const s = Number($('exportScale').value);
    const c = document.createElement('canvas');
    c.width = out.width * s; c.height = out.height * s;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(out, 0, 0, c.width, c.height);
    c.toBlob(blob => {
      const a = document.createElement('a');
      const d = new Date(), p = n => String(n).padStart(2, '0');
      a.download = `gbcamera_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  });

  // ---------- Processing ----------
  function sourceSize(src) {
    if (src instanceof HTMLVideoElement) return [src.videoWidth, src.videoHeight];
    if (src instanceof HTMLImageElement) return [src.naturalWidth, src.naturalHeight];
    return [src.width, src.height];
  }

  // Center-crop to 8:7 and shrink to 128x112
  function capture() {
    const [sw, sh] = sourceSize(source);
    if (!sw || !sh) return null;
    const aspect = W / H;
    let cw = sw, ch = sh;
    if (sw / sh > aspect) cw = sh * aspect; else ch = sw / aspect;
    const cx = (sw - cw) / 2, cy = (sh - ch) / 2;
    // Transparent pixels would otherwise keep the previous image; treat them as white paper
    wctx.fillStyle = '#fff';
    wctx.fillRect(0, 0, W, H);
    wctx.save();
    wctx.imageSmoothingEnabled = opts.down !== 'nearest';
    wctx.imageSmoothingQuality = 'high';
    if (opts.mirror) { wctx.translate(W, 0); wctx.scale(-1, 1); }
    wctx.drawImage(source, cx, cy, cw, ch, 0, 0, W, H);
    wctx.restore();
    const d = wctx.getImageData(0, 0, W, H).data;
    const g = new Float32Array(W * H);
    for (let i = 0; i < g.length; i++) {
      g[i] = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
    }
    return g;
  }

  // 3x3 [1 2 1] gaussian with clamped edges
  function blur3(g) {
    const t = new Float32Array(g.length), o = new Float32Array(g.length);
    for (let y = 0; y < H; y++) {
      const r = y * W;
      for (let x = 0; x < W; x++) {
        const l = g[r + Math.max(x - 1, 0)], c = g[r + x], rr = g[r + Math.min(x + 1, W - 1)];
        t[r + x] = (l + 2 * c + rr) / 4;
      }
    }
    for (let y = 0; y < H; y++) {
      const u = Math.max(y - 1, 0) * W, m = y * W, dn = Math.min(y + 1, H - 1) * W;
      for (let x = 0; x < W; x++) o[m + x] = (t[u + x] + 2 * t[m + x] + t[dn + x]) / 4;
    }
    return o;
  }

  function autoLevels(g) {
    const hist = new Uint32Array(256);
    for (const v of g) hist[Math.min(255, Math.max(0, Math.round(v * 255)))]++;
    const cut = g.length * 0.01;
    let lo = 0, hi = 255, acc = 0;
    for (; lo < 255; lo++) { acc += hist[lo]; if (acc > cut) break; }
    acc = 0;
    for (; hi > 0; hi--) { acc += hist[hi]; if (acc > cut) break; }
    if (hi - lo < 8) return;
    const a = lo / 255, span = (hi - lo) / 255;
    for (let i = 0; i < g.length; i++) g[i] = (g[i] - a) / span;
  }

  function quantize(g) {
    const q = new Uint8Array(W * H);
    const { brightness, contrast, gamma, vignette, dither } = opts;
    const invGamma = 1 / gamma;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        let v = (g[i] - 0.5) * contrast + 0.5 + brightness;
        if (vignette > 0) {
          const dx = (x + 0.5 - W / 2) / (W / 2), dy = (y + 0.5 - H / 2) / (H / 2);
          v *= 1 - vignette * 0.6 * (dx * dx + dy * dy);
        }
        v = v <= 0 ? 0 : v >= 1 ? 1 : Math.pow(v, invGamma);
        if (dither) {
          const s = v * 3, b = Math.floor(s);
          const t = (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
          q[i] = b >= 3 ? 3 : b + (s - b > t ? 1 : 0);
        } else {
          q[i] = Math.round(v * 3);
        }
      }
    }
    return q;
  }

  // Frame as palette indices (0 = darkest, 3 = lightest); image sits at (16,16)
  const FRAME = (() => {
    const f = new Uint8Array(FW * FH).fill(1);
    for (let y = 0; y < FH; y++) {
      for (let x = 0; x < FW; x++) {
        const i = y * FW + x;
        const edge = Math.min(x, y, FW - 1 - x, FH - 1 - y);
        if (edge < 2) f[i] = 0;
        else if (edge < 3) f[i] = 2;
        else if (((x + y) & 3) === 0 && (x & 1) === 0) f[i] = 2;
        // inner outline around the photo area
        const inX = x >= 14 && x <= 145, inY = y >= 14 && y <= 129;
        if (inX && inY) f[i] = (x === 14 || x === 145 || y === 14 || y === 129) ? 3 : 0;
      }
    }
    return f;
  })();

  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

  function render() {
    let g = capture();
    if (!g) return;
    if (opts.autoLevels) autoLevels(g);
    if (opts.blur > 0) {
      const b = blur3(g);
      for (let i = 0; i < g.length; i++) g[i] += (b[i] - g[i]) * opts.blur;
    }
    if (opts.sharpen > 0) {
      const b = blur3(g);
      for (let i = 0; i < g.length; i++) g[i] += (g[i] - b[i]) * opts.sharpen;
    }
    const q = quantize(g);

    const fw = opts.frame ? FW : W, fh = opts.frame ? FH : H;
    if (out.width !== fw || out.height !== fh) { out.width = fw; out.height = fh; }
    const pal = PALETTES[opts.palette].c.map(hexToRgb);
    const img = octx.createImageData(fw, fh);
    const d = img.data;
    const ox = opts.frame ? 16 : 0, oy = opts.frame ? 16 : 0;
    for (let y = 0; y < fh; y++) {
      for (let x = 0; x < fw; x++) {
        const px = x - ox, py = y - oy;
        const idx = (px >= 0 && px < W && py >= 0 && py < H) ? q[py * W + px] : FRAME[y * FW + x];
        const c = pal[idx], o = (y * fw + x) * 4;
        d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
    out.style.width = fw * opts.viewScale + 'px';
  }

  // Built-in sample so the dithering is visible before loading a photo
  function makeSample() {
    const c = document.createElement('canvas');
    c.width = 640; c.height = 560;
    const x = c.getContext('2d');
    const sky = x.createLinearGradient(0, 0, 0, 560);
    sky.addColorStop(0, '#f4f4f4'); sky.addColorStop(1, '#303030');
    x.fillStyle = sky; x.fillRect(0, 0, 640, 560);
    const sun = x.createRadialGradient(440, 170, 10, 440, 170, 130);
    sun.addColorStop(0, '#ffffff'); sun.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = sun; x.fillRect(0, 0, 640, 560);
    x.fillStyle = '#555';
    x.beginPath(); x.moveTo(0, 420); x.lineTo(180, 250); x.lineTo(330, 400); x.lineTo(470, 290); x.lineTo(640, 430); x.lineTo(640, 560); x.lineTo(0, 560); x.fill();
    const ground = x.createLinearGradient(0, 430, 0, 560);
    ground.addColorStop(0, '#888'); ground.addColorStop(1, '#111');
    x.fillStyle = ground; x.fillRect(0, 460, 640, 100);
    x.fillStyle = '#fff';
    x.font = 'bold 64px sans-serif'; x.textAlign = 'center';
    x.fillText('DROP PHOTO', 320, 110);
    return c;
  }

  syncUI();
  render();
})();
</script>
</body>
</html>
